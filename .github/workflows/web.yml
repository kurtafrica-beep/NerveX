name: Web app

# Builds the browser version and publishes it to GitHub Pages:
#   https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Redaction engine is built
        run: node scripts/build-engine.mjs --check

      - name: Export the web app
        run: npx expo export --platform web
        env:
          EXPO_NO_TELEMETRY: 1

      # Any deeper path (an email sign-in link, say) still opens the app.
      - name: Single-page fallback
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
